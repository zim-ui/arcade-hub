<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON RACING — ARCADE HUB</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Inter:wght@400;600;700;800&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050811;color:#eef4ff;font-family:Inter,Arial}body{display:grid;place-items:center}#game{position:relative;width:min(100vw,177.78vh);height:min(100vh,56.25vw);min-width:320px;min-height:180px;background:#070b16;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;padding:clamp(8px,2vw,20px);pointer-events:none}.box{background:#09152ddd;border:1px solid #39d5d077;border-radius:10px;padding:7px 12px;min-width:82px;backdrop-filter:blur(6px)}.lab{font:700 9px Orbitron;color:#91a6c8;letter-spacing:1px}.val{font:800 clamp(13px,2vw,21px) Orbitron;color:white;margin-top:3px;text-shadow:0 0 12px #39d5d0}#nitro{position:absolute;top:75px;left:50%;transform:translateX(-50%);width:190px;height:7px;background:#10182b;border:1px solid #39d5d088;border-radius:9px;overflow:hidden}#fill{height:100%;width:100%;background:linear-gradient(90deg,#39d5d0,#8b5cf6,#ff4da6)}#pause{position:absolute;right:16px;top:58px;z-index:3;background:#111a30;color:white;border:1px solid #8b5cf6;border-radius:8px;padding:8px 12px;font:700 10px Orbitron}#overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse, #101832cc,#030610ee)}.panel{width:min(92%,510px);text-align:center;padding:clamp(18px,4vw,34px);border:1px solid #39d5d077;border-radius:20px;background:linear-gradient(145deg,#0b172df5,#160d2bf5);box-shadow:0 0 55px #784cff22}.eyebrow{font:700 10px Orbitron;letter-spacing:3px;color:#39d5d0}h1{font:900 clamp(30px,6vw,58px)/1.05 Orbitron;margin:12px 0;color:#fff;text-shadow:0 0 14px #39d5d0,0 0 30px #8b5cf6}.sub{font-size:13px;color:#a9b9d4;line-height:1.6;margin:12px auto 20px;max-width:370px}.primary{border:0;border-radius:9px;padding:13px 28px;background:linear-gradient(100deg,#39d5d0,#8061ff,#b44cff);color:#07101d;font:900 12px Orbitron;letter-spacing:1px;cursor:pointer}.stats{display:flex;justify-content:center;gap:26px;margin:18px;color:#91a6c8;font-size:10px}.stats b{display:block;color:white;font:700 17px Orbitron;margin-top:5px}.hint{font-size:10px;color:#7184a7;margin-top:18px}#touch{position:absolute;z-index:4;bottom:12px;left:0;right:0;display:none;justify-content:space-between;padding:0 16px;pointer-events:none}.group{display:flex;gap:9px;pointer-events:auto}.touchbtn{width:54px;height:48px;border:1px solid #39d5d099;border-radius:12px;background:#09152add;color:white;font:900 17px Orbitron;touch-action:none}#boost{width:75px;border-color:#ff4da6;color:#ffb5d7;font-size:10px}@media(pointer:coarse),(max-width:700px){#touch{display:flex}.box:nth-child(2){display:none}}
</style></head><body><div id="game"><canvas id="c" width="960" height="540"></canvas><div id="hud"><div class="box"><div class="lab">SCORE</div><div class="val" id="score">000000</div></div><div class="box"><div class="lab">DISTANCE</div><div class="val" id="dist">0 KM</div></div><div class="box"><div class="lab">BEST</div><div class="val" id="best">000000</div></div></div><div id="nitro"><div id="fill"></div></div><button id="pause" hidden>Ⅱ PAUSE</button><div id="touch"><div class="group"><button class="touchbtn" id="left">◀</button><button class="touchbtn" id="right">▶</button></div><div class="group"><button class="touchbtn" id="boost">NITRO</button></div></div><div id="overlay"><div class="panel" id="panel"><div class="eyebrow">ARCADE HUB ORIGINAL</div><h1>NEON<br>RACING</h1><p class="sub">Đốt cháy đường đua thành phố tương lai. Né giao thông, gom năng lượng và bứt tốc để lập kỷ lục mới.</p><div class="stats"><div>BEST SCORE<b id="menuBest">000000</b></div><div>CONTROL<b>WASD / ← →</b></div></div><button class="primary" id="start">START ENGINE</button><div class="hint">PC: ← → hoặc A / D · Nitro: SPACE · Điện thoại: nút điều khiển</div></div></div></div>
<script>
(()=>{'use strict';const c=document.getElementById('c'),x=c.getContext('2d'),W=960,H=540,road={x:245,w:470},$=id=>document.getElementById(id);let state='menu',last=0,time=0,score=0,km=0,best=+(localStorage.neonRacingBest||0),offset=0,spawn=0,coinSpawn=1,nitro=100,boost=false,keys={},player,traffic=[],coins=[],fx=[];$('best').textContent=String(best).padStart(6,'0');$('menuBest').textContent=String(best).padStart(6,'0');
function reset(){time=score=km=offset=0;spawn=.5;coinSpawn=1;nitro=100;traffic=[];coins=[];fx=[];player={x:480,y:420,w:48,h:82};hud()}
function car(px,py,w,h,col,hero){x.save();x.translate(px,py);x.shadowColor=col;x.shadowBlur=hero?22:10;x.fillStyle='#050912';x.beginPath();x.roundRect(-w/2+3,-h/2+7,w,h,10);x.fill();let g=x.createLinearGradient(-w/2,0,w/2,0);g.addColorStop(0,'#10182a');g.addColorStop(.5,col);g.addColorStop(1,'#10182a');x.fillStyle=g;x.beginPath();x.roundRect(-w/2,-h/2,w,h,10);x.fill();x.shadowBlur=0;x.fillStyle='#14243b';x.beginPath();x.roundRect(-w*.32,-h*.2,w*.64,h*.34,7);x.fill();x.fillStyle='#36506b';x.fillRect(-w*.25,-h*.16,w*.5,h*.12);x.fillStyle=hero?'#eaffff':'#ff526b';x.shadowColor=hero?'#39d5d0':'#ff294e';x.shadowBlur=12;x.fillRect(-w*.36,-h*.47,w*.2,5);x.fillRect(w*.16,-h*.47,w*.2,5);x.shadowBlur=0;x.fillStyle='#03050a';x.fillRect(-w*.58,-h*.3,7,19);x.fillRect(w*.43,-h*.3,7,19);x.fillRect(-w*.58,h*.18,7,19);x.fillRect(w*.43,h*.18,7,19);x.restore()}
function roadDraw(){x.fillStyle='#07101b';x.fillRect(0,0,W,H);for(let i=0;i<28;i++){let xx=i*38-offset*.12%38,hh=35+(i*47%90);x.fillStyle=i%2?'#0c1a30':'#11172c';x.fillRect(xx,155-hh,28,hh);x.fillStyle='#39d5d0';x.globalAlpha=.18;for(let yy=170-hh;yy<150;yy+=15)x.fillRect(xx+7,yy,3,5);x.globalAlpha=1}x.fillStyle='#101c25';x.fillRect(0,155,W,385);x.fillStyle='#1a2940';x.fillRect(228,150,504,390);x.fillStyle='#202633';x.fillRect(245,150,470,390);x.fillStyle='#39d5d0';x.fillRect(242,150,3,390);x.fillRect(715,150,3,390);x.strokeStyle='#8795a8';x.lineWidth=3;x.setLineDash([28,25]);x.lineDashOffset=-offset;for(let i=1;i<4;i++){x.beginPath();x.moveTo(245+470/4*i,150);x.lineTo(245+470/4*i,540);x.stroke()}x.setLineDash([]);for(let y=150-offset%90;y<540;y+=90){x.fillStyle='#ff4da6';x.shadowColor='#ff4da6';x.shadowBlur=12;x.fillRect(221,y,4,34);x.fillRect(735,y,4,34);x.shadowBlur=0}}
function burst(px,py,col,n=10){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=50+Math.random()*180;fx.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.6+Math.random()*.3,col})}}
function hud(){$('score').textContent=String(score).padStart(6,'0');$('dist').textContent=Math.floor(km)+' KM';$('fill').style.width=nitro+'%'}
function update(dt){if(state!=='play')return;time+=dt;let speed=220+Math.min(210,time*3)+(boost&&nitro>0?150:0);if(boost&&nitro>0)nitro=Math.max(0,nitro-35*dt);else nitro=Math.min(100,nitro+11*dt);let dir=(keys.ArrowLeft||keys.a||keys.A?-1:0)+(keys.ArrowRight||keys.d||keys.D?1:0);player.x+=dir*390*dt;player.x=Math.max(279,Math.min(681,player.x));offset+=speed*dt;km+=speed*dt/1000;score+=Math.floor(speed*dt*.12);spawn-=dt;if(spawn<=0){let lane=Math.floor(Math.random()*4);traffic.push({x:245+470/4*(lane+.5),y:-80,w:45,h:80,col:['#ff4d76','#ffb84d','#8b72ff','#45d6c7'][Math.floor(Math.random()*4)],v:140+Math.random()*90});spawn=Math.max(.42,1.1-time*.008)+Math.random()*.35}coinSpawn-=dt;if(coinSpawn<=0){let lane=Math.floor(Math.random()*4);coins.push({x:245+470/4*(lane+.5),y:-20,a:0});coinSpawn=1.1+Math.random()*1.1}for(let i=traffic.length-1;i>=0;i--){let t=traffic[i];t.y+=(speed-t.v+100)*dt;if(t.y>600){traffic.splice(i,1);score+=25;continue}if(Math.abs(player.x-t.x)<34&&Math.abs(player.y-t.y)<58){burst(player.x,player.y,'#ff4d76',30);gameOver();return}}for(let i=coins.length-1;i>=0;i--){let q=coins[i];q.y+=speed*dt;q.a+=dt*8;if(q.y>570)coins.splice(i,1);else if(Math.hypot(player.x-q.x,player.y-q.y)<38){coins.splice(i,1);score+=150;nitro=Math.min(100,nitro+12);burst(q.x,q.y,'#ffd76a')}}for(let i=fx.length-1;i>=0;i--){let p=fx[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;if(p.l<=0)fx.splice(i,1)}hud()}
function draw(){roadDraw();for(let i=0;i<18;i++){let y=(i*37+offset*1.7)%540;x.globalAlpha=.25;x.fillStyle=i%2?'#39d5d0':'#8b5cf6';x.fillRect(170-(i%3)*12,y,18,2);x.fillRect(770+(i%3)*12,y,18,2)}x.globalAlpha=1;for(let q of coins){x.save();x.translate(q.x,q.y);x.rotate(q.a);x.shadowColor='#ffd76a';x.shadowBlur=18;x.fillStyle='#ffd76a';x.beginPath();x.ellipse(0,0,7,11,0,0,7);x.fill();x.restore()}for(let t of traffic)car(t.x,t.y,t.w,t.h,t.col,false);for(let p of fx){x.globalAlpha=Math.max(0,p.l);x.fillStyle=p.col;x.fillRect(p.x,p.y,4,4)}x.globalAlpha=1;if(player){if(boost&&nitro>0){x.fillStyle='#39d5d0';x.shadowColor='#39d5d0';x.shadowBlur=22;x.beginPath();x.moveTo(player.x-10,455);x.lineTo(player.x,495+Math.random()*10);x.lineTo(player.x+10,455);x.fill();x.shadowBlur=0}car(player.x,player.y,player.w,player.h,'#39d5d0',true);if(boost){x.fillStyle='#39d5d0';x.globalAlpha=.06;x.fillRect(0,0,W,H);x.globalAlpha=1}}}
function start(){reset();state='play';$('overlay').style.display='none';$('pause').hidden=false;$('pause').textContent='Ⅱ PAUSE'}function gameOver(){state='over';$('pause').hidden=true;if(score>best){best=score;localStorage.neonRacingBest=best;$('best').textContent=String(best).padStart(6,'0')}$('overlay').style.display='grid';$('panel').innerHTML=`<div class="eyebrow">RACE COMPLETE</div><h1>CRASHED!</h1><p class="sub">Bạn đã đi được ${Math.floor(km)} km trên đường đua neon.</p><div class="stats"><div>YOUR SCORE<b>${String(score).padStart(6,'0')}</b></div><div>BEST SCORE<b>${String(best).padStart(6,'0')}</b></div></div><button class="primary" id="again">RACE AGAIN</button> <button class="primary" id="home">MAIN MENU</button>`;$('again').onclick=start;$('home').onclick=menu}
function menu(){state='menu';$('overlay').style.display='grid';$('pause').hidden=true;$('panel').innerHTML=`<div class="eyebrow">ARCADE HUB ORIGINAL</div><h1>NEON<br>RACING</h1><p class="sub">Đốt cháy đường đua thành phố tương lai. Né giao thông, gom năng lượng và bứt tốc để lập kỷ lục mới.</p><div class="stats"><div>BEST SCORE<b>${String(best).padStart(6,'0')}</b></div><div>CONTROL<b>WASD / ← →</b></div></div><button class="primary" id="go">START ENGINE</button><div class="hint">PC: ← → hoặc A / D · Nitro: SPACE · Điện thoại: nút điều khiển</div>`;$('go').onclick=start}
function pause(){if(state==='play'){state='paused';$('overlay').style.display='grid';$('panel').innerHTML='<div class="eyebrow">RACE PAUSED</div><h1>PAUSED</h1><button class="primary" id="resume">RESUME RACE</button>';$('resume').onclick=()=>{state='play';$('overlay').style.display='none'}}else if(state==='paused'){state='play';$('overlay').style.display='none'}}
$('start').onclick=start;$('pause').onclick=pause;window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' '&&state==='play')boost=true;if(e.key==='Escape')pause()});window.addEventListener('keyup',e=>{keys[e.key]=false;if(e.key===' ')boost=false});function hold(id,on,off){let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();on()});['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,e=>{e.preventDefault();off()}))}hold('left',()=>keys.ArrowLeft=true,()=>keys.ArrowLeft=false);hold('right',()=>keys.ArrowRight=true,()=>keys.ArrowRight=false);hold('boost',()=>boost=true,()=>boost=false);c.addEventListener('pointerdown',e=>{if(state!=='play')return;let r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*960;keys.ArrowLeft=px<player.x;keys.ArrowRight=px>=player.x});c.addEventListener('pointerup',()=>{keys.ArrowLeft=keys.ArrowRight=false});function frame(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
